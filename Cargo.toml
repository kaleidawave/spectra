[package]
name = "spectra"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "spectra"
path = "src/lib.rs"

[[bin]]
name = "spectra"
path = "src/main.rs"

[dependencies]
simple-markdown-parser = { git = "https://github.com/kaleidawave/simple-markdown-parser", version = "0.0.7", branch = "improvements" }
pretty_assertions = "1.4.1"
crossterm = "0.29.0"
colored = "3.0.0"
lahl = "0.0.3"
simple-yaml-parser = "0.0.1"
json-builder-macro = "0.0.3"
libloading = "0.9.0"
glob = "0.3.3"

[lints.clippy]
pedantic = "warn"

[package.metadata.scripts]
example = "cargo r -- test ./include/specification.uppercase.md 'cargo r -q --example example_program -- --uppercase --interactive --rpc'"

example-options = "cargo r -- test ./include/specification.options.md 'cargo r -q --example example_program -- --uppercase --interactive --rpc'"
example-intentional-crash = "cargo r -- test ./include/specification.uppercase.md 'cargo r -q --example example_program -- --uppercase --interactive --rpc --intentional-crash'"
example-rust = "cargo r -- test ./include/specification.uppercase.md 'rust:include/rust-runner::get_result'"

example-infill = "cargo r -- test ./include/specification-infill.md 'cargo r -q --example example_program -- --uppercase --interactive --rpc' --infill"
example-dry-run = "cargo r -- test ./include/specification.uppercase.md 'cargo r -q --example example_program -- --uppercase --interactive --rpc' --dry-run"

example-list = "cargo r -- list ./include/specification.uppercase.md --json"

example-config-file = "cargo r -- test ./private/specification.lists.md 'cargo r -q --example example_program -- --uppercase --use-lists --interactive --rpc' --config private/config.yml"
