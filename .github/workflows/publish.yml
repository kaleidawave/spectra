name: Check and release

on: push

jobs:
  check:
    runs-on: ubuntu-latest

    timeout-minutes: 3

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        # Required by some tests
      - uses: oven-sh/setup-bun@v2

      - name: Run check
        run: cargo check

      - name: Run test
        run: cargo test

  make-release:
    needs: check

    # Publish on `main` branch additions
    if: ${{ github.ref_name == 'main' }}

    runs-on: ubuntu-latest

    permissions: { contents: write }
    outputs: { tag: "${{ steps.create-release.outputs.tag }}" }

    steps:
    - uses: actions/checkout@v6  
    - uses: kaleidawave/release-downloader@improvements
      env: { GH_TOKEN: "${{ github.token }}" }
      with: { items: 'kaleidawave/crates-release-gh-action@assets[crates-release]' }
    
    - name: Update version
      id: update-version
      run: |
        request=$(curl '${{ secrets.VERSION_REQUEST_URL }}')
        version=$(crates-release change-version $request --print-new-version)
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Create release
      id: create-release
      env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      run: |
        tag="v${{ steps.update-version.outputs.version }}"
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        git add -u
        git commit -m "Release '${{ steps.update-version.outputs.version }}'"
        git tag -a $tag -m "release ${{ steps.update-version.outputs.version }}"
        git push origin ${{ github.ref_name }}
        git push origin tag $tag

        gh release create $tag --target ${{ github.ref_name }} -t "Release ${{ steps.update-version.outputs.version }}"

  publish-assets:
    needs: make-release

    permissions: write-all

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
        - os: windows-latest
          platform-name: x86_64-pc-windows
          executable-extension: ".exe"
        - os: ubuntu-latest
          platform-name: x86_64-unknown-linux
        - os: macos-latest
          platform-name: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}

    env:
      PROFILE: dev
      OUT: target/debug
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Set variables
        id: information
        shell: bash
        run: |
          echo "GITHUB_RUN_DATE=$(TZ="Europe/London" date +"%Y-%m-%d %T")" >> "$GITHUB_OUTPUT"
          echo "GIT_LAST_COMMIT=$(git log -n 1 --format="%H")" >> "$GITHUB_OUTPUT"

      - name: Build binary
        run: cargo build --profile ${{ env.PROFILE }}
        env:
          GITHUB_RUN_DATE: ${{ steps.information.outputs.GITHUB_RUN_DATE }}
          GIT_LAST_COMMIT: ${{ steps.information.outputs.GIT_LAST_COMMIT }}

      - name: Publish binary
        shell: bash
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          FROM="${{ env.OUT }}/spectra${{ matrix.executable-extension }}"
          TO="spectra-${{ matrix.platform-name }}${{ matrix.executable-extension }}"
          mv $FROM $TO
          gh release upload "${{ needs.make-release.outputs.tag }}" "$TO" --clobber
